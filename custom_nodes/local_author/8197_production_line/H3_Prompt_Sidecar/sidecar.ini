# SANITIZED_PUBLIC_COPY — 本文件由私有原件经内容级脱敏生成：已移除个人素材/媒体、个人创作提示词、本机绝对路径、身份与凭据、运行状态；历史结论、日期、耗时与验收结果未作任何篡改。
[sidecar]
MODEL_PROVIDER = local_llamacpp

[director]
default_model = dark_roast
ui_default_model = dark_roast
; Empty Planner follows the model selected for this Director request.
planner_model =
model_registry = <REDACTED_LOCAL_PATH>/D

[local_llamacpp]
base_url = http://127.0.0.1:8095
port = 8095
runtime = <REDACTED_LOCAL_PATH>/D
context_safety_margin = 256
planner_min_output = 3500
parallel = 1
threads = 16
reasoning = OFF
n_cpu_ffn = 4
gpu_layers = 99
vision = OFF
mmproj = OFF
sleep_unload = OFF
prefix_cache = ON
kv_k = q8_0
kv_v = q8_0
seed = 42
log_path = <REDACTED_LOCAL_PATH>/D

[model.dark_roast]
registry_key = dark_roast
label = DARK ROAST 9B（默认 / 更快）
provider = local_llamacpp
alias = h3-prompt-director-dark-roast
ctx = 16384
threads = 16
n_cpu_ffn = 4
temperature = 0.3
top_p = 0.9
chat_template_kwargs = {"enable_thinking": false}

[model.gemma4]
registry_key = gemma4
label = Gemma4 12B（高质量）
provider = local_llamacpp
alias = h3-prompt-director-gemma4-12b
ctx = 16384
threads = 16
n_cpu_ffn = 4
temperature = 0.3
top_p = 0.9
chat_template_kwargs = {"enable_thinking": false}


[model.free_luna]
provider = openai_compat
label = GPT-5.6 Luna｜免费大尺度
base_url = http://127.0.0.1:20128/v1
model = ddgw/gpt-5.6-luna
api_key_env = OMNIROUTE_API_KEY
temperature = 0.3
top_p = 0.9

[model.free_mistral]
provider = openai_compat
label = Mistral Small 2603｜免费大尺度
base_url = http://127.0.0.1:20128/v1
model = ddgw/mistral-small-2603
api_key_env = OMNIROUTE_API_KEY
temperature = 0.3
top_p = 0.9

[model.free_gemma4]
provider = openai_compat
label = Gemma4 31B｜免费大尺度
base_url = http://127.0.0.1:20128/v1
model = ddgw/tinfoil/gemma4-31b
api_key_env = OMNIROUTE_API_KEY
temperature = 0.3
top_p = 0.9

[model.free_sba]
provider = openai_compat
label = Space Bunny Alpha｜免费大尺度
base_url = https://openrouter.ai/api/v1
